services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: epc, POSTGRES_PASSWORD: change-me, POSTGRES_DB: epc }
    volumes: [pgdata:/var/lib/postgresql/data]
  app:
    build: .
    depends_on: [db]
    ports: ["4000:4000"]
    environment:
      DATABASE_URL: postgresql://epc:change-me@db:5432/epc
      JWT_SECRET: replace-with-a-long-random-secret-of-at-least-32-chars
    volumes: [files:/data/storage]
volumes: { pgdata: {}, files: {} }
